[package]
name = "frame-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "The frame's updates, Wi-Fi and hotspot: frame-update, frame-wifid, frame-power-key; frame-sign on the build machine"
publish = false

[dependencies]
# a slot's manifest and its check, the initramfs's own
frame-seal = { path = "seal" }
# the release key's making and its signatures (frame-sign, on the build machine)
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# HTTPS without an async runtime: rustls and the webpki roots
ureq = "3.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
