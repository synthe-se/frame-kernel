# SSH: root by a short-lived certificate of the frame's CA only (bin/ssh-cert.sh): no key
# shared between frames, no password anywhere (root's is locked), the host keys kept on userdata
# (generated on the frame once by frame-ssh-keys.service: the same at every boot, never in the
# image).
PermitRootLogin prohibit-password
TrustedUserCAKeys /etc/ssh/frame-ca.pub
AuthorizedPrincipalsFile none
AuthorizedKeysFile none
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
HostKey /android-data/frame/ssh/ssh_host_ed25519_key
