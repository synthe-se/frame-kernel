# One known board: udev walks the devices something asks it about, not all 267 of them (67 virtual
# consoles, 41 platform devices, the clocks, the regulators…), which took two seconds of all four
# processors in the middle of the boot. The network and the disks first: units wait for them.
[Service]
ExecStart=
ExecStart=-udevadm trigger --type=devices --action=add --prioritized-subsystem=net,block --subsystem-match=net --subsystem-match=block --subsystem-match=input --subsystem-match=drm --subsystem-match=backlight --subsystem-match=graphics --subsystem-match=iio --subsystem-match=ieee80211 --subsystem-match=sdio --subsystem-match=mmc --subsystem-match=misc --subsystem-match=watchdog --subsystem-match=i2c-dev --subsystem-match=udc
