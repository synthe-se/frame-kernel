# The frame has no battery and its system lives in RAM: timesyncd's clock file (its last
# synchronised time, which it sets the clock from as it starts) is kept on the data partition, so a power
# cut brings the clock back to minutes ago, not to the system's build day (TLS refuses that).
# The directory comes from frame-data.service: BindPaths wants it before ExecStartPre runs.
[Unit]
Requires=frame-data.service
After=frame-data.service

[Service]
BindPaths=/data/frame/timesync:/var/lib/systemd/timesync
